    let activeQuestions = [];
    let currentQuestionIndex = 0;
    let score = 0;
    let incorrectAnswers = [];

  
    function shuffleArray(array) {
      let arr = [...array];
      for (let i = arr.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [arr[i], arr[j]] = [arr[j], arr[i]];
      }
      return arr;
    }

    
    function startQuiz(level) {
      const fullPool = quizQuestion[level];
      activeQuestions = shuffleArray(fullPool).slice(0, 5);

      currentQuestionIndex = 0;
      score = 0;
      incorrectAnswers = [];

      document.getElementById('difficulty-box').style.display = 'none';
      document.getElementById('quiz-box').style.display = 'block';
      loadQuestion();
    }
     
    function loadQuestion() {
           const optionsContainer = document.getElementById('options-container');
      optionsContainer.innerHTML = '';
      
           const currentData = activeQuestions[currentQuestionIndex];
      document.getElementById('question-text').innerText = currentData.question;

      currentData.options.forEach((optionText, index) => {
        const button = document.createElement('button');
        button.innerText = optionText;
        button.classList.add('btn');
                               button.onclick = () => selectAnswer(index);
        optionsContainer.appendChild(button);
      });
    }
     

    function selectAnswer(selectedIndex) {
                        const currentData = activeQuestions[currentQuestionIndex];

      if (selectedIndex === currentData.correct) {
        score++;
      } else {
        incorrectAnswers.push({
          question: currentData.question,
                                    selected: currentData.options[selectedIndex],
          correct: currentData.options[currentData.correct]
        });
      }

      currentQuestionIndex++;
      if (currentQuestionIndex < activeQuestions.length) {
        loadQuestion();
                   } else {
        showResult();
      }
    }

    function showResult() {
                           document.getElementById('quiz-box').style.display = 'none';
                document.getElementById('result-box').style.display = 'block';
                 document.getElementById('score-text').innerText = `You scored ${score} out of ${activeQuestions.length}!`;

      const reviewContainer = document.getElementById('review-container');

      if (incorrectAnswers.length > 0) {
        let reviewHTML = '<h3 style="font-size: 15px; margin-bottom: 10px;">Review Incorrect Answers:</h3>';
                           incorrectAnswers.forEach(item => {
          reviewHTML += `
            <div class="review-item">
              <div class="review-q">${item.question}</div>
                                    <div class="wrong-ans">Your answer: ${item.selected}</div>
              <div class="correct-ans">Correct answer: ${item.correct}</div>
            </div>
          `;
        });
        reviewContainer.innerHTML = reviewHTML;
      } else {
                       reviewContainer.innerHTML = '<p style="color: #22c55e; font-size: 15px;"> :D Perfect score! No wrong answers.</p>';
      }
    }

    function restartQuiz() {
      document.getElementById('result-box').style.display = 'none';
                        document.getElementById('difficulty-box').style.display = 'block';
    }

                         function toggleTheme() {
      const body = document.body;
                             const themeBtn = document.querySelector('.theme-btn');

                     if (body.classList.contains('light-theme')) {
        body.classList.remove('light-theme');
                            themeBtn.innerText = '☀️ Light Mode';
      } else {
        body.classList.add('light-theme');
                      themeBtn.innerText = '🌙 Dark Mode';
      }
